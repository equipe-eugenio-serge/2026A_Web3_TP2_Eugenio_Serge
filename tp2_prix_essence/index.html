    <!-- 
      
      1. SOURCES TIERCES :
         - Framework CSS/JS : Bootstrap v5.3.3 (Licence MIT - https://getbootstrap.com/)
         - CDN : jsDelivr (https://www.jsdelivr.com/)
         - Source probable des données applicatives : U.S. Energy Information Administration (https://www.eia.gov/)

      Source : code de référence généré par Claude (Anthropic, 2026)
      2. REQUÊTE ORIGINALE (PROMPT) :
         "je veux ajouter du bootstrap: [code HTML brut]
          je veux utiliser le lien bootstrap en ligne simple
          je veux un meilleur formulaire
  

      3. PROPOSITION :
         - Conserver intégralement les identifiants originaux (id="formulaire", 
           id="devise", id="etat", id="mois-debut", id="annee-debut", etc.) 
           afin de garantir une compatibilité sans rupture avec les scripts JS/TS.
         - Remplacer le rendu brut sans mise en page par une interface structurée en 
           grille responsive, avec des conteneurs visuels clairs (cartes) et des champs
           de formulaire stylisés selon le standard visuel Bootstrap 5.

      4. DÉTAIL DES MODIFICATIONS APPORTÉES :
         - Balise <head> : Inclusion du CDN Bootstrap 5.3.3 minifié.
         - <body> : Ajout des classes utilitaires "bg-light" et "py-5" pour un fond doux et un espacement vertical.
         - <main> : Transformation en conteneur centré ("container") avec limitation de largeur maximale (900px).
         - <form> : Intégration dans une carte Bootstrap ("card", "shadow-sm", "border-0").
         - Éléments <select> : Remplacement des styles par défaut par la classe ".form-select".
         - Éléments <label> : Ajout des classes ".form-label", ".fw-semibold" et ".small".
         - Champs Début / Fin (<fieldset>) : Regroupement sur 2 colonnes via ".row" et ".col-md-6",
           avec habillage carte légère (".border", ".rounded-3", ".bg-body-tertiary").
         - Bouton (<button>) : Application des classes ".btn", ".btn-primary", ".btn-lg" et conteneur ".d-grid" 
           pour un bouton pleine largeur, accessible et tactile.
         - <footer> : Ajout d'une section de bas de page créditant formellement les outils et données.
         - Script : Ajout du bundle JavaScript Bootstrap avant la fermeture du corps.
      ========================================================================
    -->

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Évolution des prix de l'essence</title>


    <!-- Lien CSS Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="bg-light py-5">
    <main class="container" style="max-width: 900px;">
      
      <!-- Titre principal -->
      <h1 class="text-center mb-4 fw-bold text-dark">
        Évolution du prix de l'essence aux États-Unis
      </h1>

      <!-- Carte du formulaire -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <form id="formulaire">
            
            <!-- Ligne 1 : Devise et État -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="devise" class="form-label fw-semibold">Devise</label>
                <select id="devise" class="form-select"></select>
              </div>
              <div class="col-md-6">
                <label for="etat" class="form-label fw-semibold">État</label>
                <select id="etat" class="form-select"></select>
              </div>
            </div>

            <!-- Ligne 2 : Périodes Début et Fin -->
            <div class="row g-3 mb-4">
              <!-- Début -->
              <div class="col-md-6">
                <fieldset class="border rounded-3 p-3 h-100 bg-body-tertiary">
                  <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-2">Période de début</legend>
                  <div class="row g-2">
                    <div class="col-6">
                      <label for="mois-debut" class="form-label small text-muted">Mois</label>
                      <select id="mois-debut" class="form-select"></select>
                    </div>
                    <div class="col-6">
                      <label for="annee-debut" class="form-label small text-muted">Année</label>
                      <select id="annee-debut" class="form-select"></select>
                    </div>
                  </div>
                </fieldset>
              </div>

              <!-- Fin -->
              <div class="col-md-6">
                <fieldset class="border rounded-3 p-3 h-100 bg-body-tertiary">
                  <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-2">Période de fin</legend>
                  <div class="row g-2">
                    <div class="col-6">
                      <label for="mois-fin" class="form-label small text-muted">Mois</label>
                      <select id="mois-fin" class="form-select"></select>
                    </div>
                    <div class="col-6">
                      <label for="annee-fin" class="form-label small text-muted">Année</label>
                      <select id="annee-fin" class="form-select"></select>
                    </div>
                  </div>
                </fieldset>
              </div>
            </div>

            <!-- Bouton d'action -->
            <div class="d-grid pt-2">
              <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                Afficher le graphique
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Zone d'alerte / message -->
      <div id="message" class="message alert alert-info d-none mb-4" role="alert"></div>

      <!-- Zone graphique -->
      <div class="card shadow-sm border-0 p-4 mb-4">
        <div class="zone-graphique">
          <canvas id="graphique"></canvas>
        </div>
      </div>

      <!-- Pied de page : Crédits visibles -->
      <footer class="text-center text-muted small">
        <p class="mb-1">
          Interface stylisée avec le framework 
          <a href="https://getbootstrap.com" target="_blank" rel="noopener noreferrer" class="text-decoration-none">Bootstrap</a> 
          (Licence MIT via CDN jsDelivr).
        </p>
        <p class="mb-0">
          Source des données : 
          <a href="https://www.eia.gov/" target="_blank" rel="noopener noreferrer" class="text-decoration-none">U.S. Energy Information Administration (EIA)</a>.
        </p>
      </footer>

    </main>

    <!-- Script JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script applicatif TypeScript / JavaScript -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
